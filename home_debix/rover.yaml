
# The modules that resolves dependencies and ZMQ addresses, nothing works without it!
- name: System Manager
  cmd: mod-SystemManager -service-yaml /home/debix/mods/mod-SystemManager/service.yaml -debug


# This takes commands from a module named "controller"
- name: Actuator
  cmd: mod-Actuator -service-yaml /home/debix/mods/mod-Actuator/service.yaml -debug


# The provided Controller and Imaging will make the rover drive around quite slowly.
# If you would like to change their behavior, make a new service.yaml with your changes.
# The rover update command will overwrite anything inside the ~/mods/ directory
- name: Controller
  cmd: mod-Controller -service-yaml /home/debix/mods/mod-Controller/service.yaml -debug

- name: Imaging
  cmd: mod-Imaging -service-yaml /home/debix/mods/mod-Imaging/service.yaml -debug


