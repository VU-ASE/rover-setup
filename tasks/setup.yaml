- name: Add boot script to rc.local
  tags:
    - setup
  become: true
  copy:
    dest: /etc/rc.local
    content: |
      #!/bin/sh -e
      #
      # rc.local
      #
      # This script is executed at the end of each multiuser runlevel.
      # Make sure that the script will "exit 0" on success or any other
      # value on error.
      #
      # In order to enable or disable this script just change the execution
      # bits.
      #
      # By default this script does nothing.


      if [ -e /usr/local/polyhex/bin/polyhex_script ]
      then
          /usr/local/polyhex/bin/polyhex_script
      fi

      if [ -e /home/debix/ase/bin/on-boot.sh ]
      then
          /home/debix/ase/bin/on-boot.sh
      fi

      exit 0

- name: Install the system-start service
  tags:
    - setup
  become: true
  copy:
    dest: /etc/systemd/system/ase-system-start.service
    content: |
      [Unit]
      Description=Resets Rover servos and motors, early in the boot sequence
      Before=basic.target
      After=local-fs.target sysinit.target
      DefaultDependencies=no

      [Service]
      Type=oneshot
      ExecStart=/home/debix/ase/bin/system-start

      [Install]
      WantedBy=basic.target

- name: Install system-shutdown script
  tags:
    - setup
    - files
  become: true
  copy:
    src: "/home/debix/ase/bin/system-shutdown"
    dest: "/usr/lib/systemd/system-shutdown/rover-shutdown"
    remote_src: yes
    mode: preserve
    owner: root
    group: root
