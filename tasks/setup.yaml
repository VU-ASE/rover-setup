---


- name: "Change hostname to inventory group name"
  hostname:
    name: "{{ group_names[0] }}"


- name: Stop gdm3 systemd service
  systemd_service:
    name: gdm3
    state: stopped


- name: Update and upgrade apt packages
  become: true
  apt:
    upgrade: yes
    update_cache: yes


- name: Make sure GO path is in /etc/profile
  lineinfile:
    path: /etc/profile
    line: export PATH=$PATH:/usr/local/go/bin:/home/debix/ase-bin
    create: yes


- name: Install dependencies
  become: true
  package:
    update_cache: yes
    name:
      - libzmq3-dev
      - vim
      - cmake
      - make
      - curl
      - i2c-tools
      - command-not-found
      - apt-file
      - libi2c-dev
      - less
      - picocom
      - build-essential
      - mpg123

- name: Remove annoying tracker
  become: true
  apt:
    name:
      - tracker
      - tracker-extract
      - tracker-miner-fs
    state: absent


- name: Remove superfluous directories
  file:
    name: "/home/debix/{{ item }}"
    state: absent
  loop:
    - Desktop
    - Downloads
    - Documents
    - Pictures
    - Music
    - Templates
    - Videos
    - Public


- name: Make sure directories exists
  tags: copy
  file:
    path: "{{ item }}"
    owner: debix
    group: debix
    mode: '0755'
    state: directory
  loop:
    - /home/debix/ase-gocv
    - /home/debix/ase-bin


- name: Copy runner program 
  tags: copy
  copy:
    src: scripts/runner
    dest: /home/debix/ase-bin/
    owner: debix
    group: debix
    mode: '777'


