---


- name: Change hostname
  debug:
    msg: "Will change the hostname to {{ inventory_hostname }}"


- name: Update and upgrade apt packages
  become: true
  apt:
    upgrade: yes
    update_cache: yes


- name: Make sure GO path is in /etc/profile
  lineinfile:
    path: /etc/profile
    line: export PATH=$PATH:/usr/local/go/bin
    create: yes


- name: Install dependencies
  become: true
  package:
    update_cache: yes
    name:
      - libzmq3-dev
      - vim
      - cmake
      - make
      - curl


# Make dir /home/debix/ase-gocv
- name: Make sure /home/debix/ase-gocv directory exists
  tags: copy
  file:
    path: "/home/debix/ase-gocv"
    state: directory


