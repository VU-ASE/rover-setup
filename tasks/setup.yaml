---
- name: "Change hostname to inventory group name"
  tags: setup
  hostname:
    name: "{{ group_names | select('match', 'rover') | first }}"

# ------------------------------------------
# --- Remove unnecessary gnome processes ---
# ------------------------------------------

- name: Stop gnome systemd service
  tags:
    - setup
  systemd_service:
    name: "{{ item }}"
    state: stopped
  loop:
    - gdm
    - gdm3
  ignore_errors: true

- name: Disable gnome systemd service
  tags:
    - setup
  systemd_service:
    name: "{{ item }}"
    enabled: false
  loop:
    - gdm
    - gdm3
  ignore_errors: true

- name: Rename gdm* service files for good
  tags:
    - setup
    - home
    - testing
  become: true
  command: "{{ item }}"
  loop:
    - "mv /usr/lib/systemd/system/gdm.service /usr/lib/systemd/system/gdm.service.bak"
    - "mv /usr/lib/systemd/system/gdm3.service /usr/lib/systemd/system/gdm3.service.bak"
  ignore_errors: true

- name: Disable gdm-session-workers
  become: true
  tags:
    - setup
  lineinfile:
    path: /etc/gdm3/custom.conf
    regexp: "^{{ item }}"
    line: "# {{ item }}"
  loop:
    - "  AutomaticLoginEnable = true"
    - "  AutomaticLogin = debix"

- name: Remove annoying tracker
  tags: setup
  become: true
  apt:
    name:
      - tracker
      - tracker-extract
      - tracker-miner-fs
    state: absent

# --------------
# --- Update ---
# --------------
- name: Update and upgrade apt packages
  tags:
    - setup
    - update
  become: true
  apt:
    upgrade: yes
    update_cache: yes

- name: Make sure GO path is in /etc/profile
  tags:
    - setup
    - files
    - path
  lineinfile:
    path: /etc/profile.d/ase-path.sh
    line: export PATH=$PATH:/usr/local/go/bin:/home/debix/ase/bin
    create: true
    mode: "0755"

# -------------------------
# --- Edits to home dir ---
# -------------------------

- name: Remove superfluous directories
  tags:
    - setup
    - files
  file:
    name: "/home/debix/{{ item }}"
    state: absent
  loop:
    - Desktop
    - Downloads
    - Documents
    - Pictures
    - Music
    - Templates
    - Videos
    - Public

- name: Copy contents of home_debix
  tags:
    - setup
    - files
    - home
    - testing
  copy:
    src: home_debix/
    dest: /home/debix/
    owner: debix
    group: debix
    mode: "755"

- name: Add user debix to group i2c
  tags:
    - setup
  become: true
  user:
    name: debix
    groups: i2c
    append: yes

