- name: Make sure old networking files don't exist
  tags: network
  become: true
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/netplan/01-netcfg.yaml
    - /etc/netplan/02-netcfg.yaml

- name: Set netplan configuration file
  tags: network
  become: true
  copy:
    dest: /etc/netplan/60-aselabs-wifi.yaml
    directory_mode: "0600"
    owner: root
    group: root
    content: |
      network:
        version: 2
        renderer: NetworkManager
        wifis:
          wlan0:
            dhcp4: true
            optional: true
            access-points:
              "aselabs":
                password: "{{ wifi_password }}"
            addresses:
              - "{{ custom_address }}/24"
            routes:
              - to: default
                via: 192.168.0.1
            nameservers:
              addresses: [192.168.0.1, 1.1.1.1]
        ethernets:
          ens33:
            dhcp4: true
            optional: true
            addresses:
              - "{{ custom_address }}/24"
            nameservers:
              addresses: [192.168.0.1, 1.1.1.1]



