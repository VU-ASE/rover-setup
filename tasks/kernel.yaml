    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-io-JW070R0520B02.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-io-JW080R1120B02.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-io-JW101HD-X00.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-io-raspberrypi-touchscreen.dtb"
