---


# ------------------------------------------
# Copying custom built kernel files to debix
# ------------------------------------------

- name: Copy over and install kernel modules
  tags: kernel
  unarchive:
    src: "{{ kernel_dir }}/out/lib/modules/6.1.22-ase2024.tar.gz"
    dest: /lib/modules
 
# Possibly run a depmod -a
# or after module errors or a reboot


- name: Copy over dtb files
  tags: kernel
  copy:
    src: "{{ item }}"
    dest: /home/debix/ase/linux/dtbs/
    owner: debix
    group: debix
    mode: '644'
  loop:
    - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-evk.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-4g-board.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-ar1335.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-board.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-gc2145.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-HC050IG40029-D58V.C.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-HC080IY28026-D60V.C.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-HC101IK25050-D59V.C.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-JW050R0320I01.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-JW070R0520B02.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-JW080R1120B02.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-JW101HD-X00.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-core-ov5640.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-io-board.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-io-HC050IG40029-D58V.C.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-io-HC080IY28026-D60V.C.dtb"
    # - "{{ kernel_dir }}/arch/arm64/boot/dts/freescale/imx8mp-debix-io-HC101IK25050-D59V.C.dtb"
